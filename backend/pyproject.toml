[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monsoonpp"
version = "0.1.0"
description = "Regime-aware AI post-processing of monsoon rainfall forecasts (SIH / MoES-NCMRWF)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow",
    "xarray>=2023.1",
    "netCDF4",
    "scipy",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "shapely>=2.0",
    "pyyaml",
    "matplotlib",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
real = ["herbie-data", "cfgrib", "eccodes", "imdlib", "cdsapi", "geopandas", "h5py"]
dev = ["pytest", "httpx"]

[project.scripts]
monsoonpp = "monsoonpp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
