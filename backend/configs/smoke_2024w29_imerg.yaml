# Seven-day real-data SMOKE TEST: GFS 00Z D+1 vs NASA GPM IMERG (SMOKE_TEST_PROXY).
# Validates the engineering chain only. IMERG is not IMD and not observational truth.
name: smoke_2024w29_imerg
forecast_source: gfs
obs_source: imerg
# No date-label convention applies: IMERG windows are built from explicit granule intervals.
obs_time_convention: UNVERIFIED
grid: {lat_min: 6.5, lat_max: 38.5, lon_min: 66.5, lon_max: 100.0, res: 0.25}   # canonical IMD grid
adapter_options:
  gfs_product: pgrb2.0p25
  obs:
    # 336 half-hourly IMERG Final V07 HDF5 granules covering 2024-07-15 03:00Z .. 2024-07-22 03:00Z
    files: ["data/raw/imerg/3B-HHR.MS.MRG.3IMERG.2024071*.HDF5", "data/raw/imerg/3B-HHR.MS.MRG.3IMERG.2024072*.HDF5"]
    origin: "NASA GES DISC GPM_3IMERGHH v07, https://data.gesdisc.earthdata.nasa.gov/data/GPM_L3/GPM_3IMERGHH.07/, downloaded 2026-09-29"
smoke:
  start: "2024-07-15"          # forecast labels: window 03Z label -> 03Z label+1
  end: "2024-07-21"
  lead: 1
  # gfs_local_dir: data/raw/gfs_local   # optional: pre-downloaded GFS; default fetches via Herbie (AWS)
  mask: india_outline
  min_coverage: 1.0
